
name: RobMotion Cloud Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render MP4
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: robmotion-video
          path: output.mp4
          if-no-files-found: error
