name: RobMotion Cloud Render

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Bahasa suara (id, en, auto)"
        default: "en"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean voice-over (pendekkan jeda panjang)
        run: |
          VOICE=$(ls voice.* 2>/dev/null | head -n1 || true)
          if [ -n "$VOICE" ]; then
            ffmpeg -y -i "$VOICE" -af "silenceremove=start_periods=0:stop_periods=-1:stop_duration=0.25:stop_threshold=-50dB:stop_silence=0.1" voice_clean.wav
          fi

      - name: Align voice-over
        run: |
          if [ -f voice_clean.wav ]; then
            python -m pip install faster-whisper
            python align.py voice_clean.wav "${{ inputs.language }}"
          else
            echo "" > timing.js
          fi

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render MP4
        run: npm run render

      - name: Add voice-over
        run: |
          if [ -f voice_clean.wav ]; then
            ffmpeg -y -i output.mp4 -i voice_clean.wav -map 0:v -map 1:a -c:v copy -c:a aac -af apad -shortest final.mp4
          else
            cp output.mp4 final.mp4
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: robmotion-video
          path: final.mp4
          if-no-files-found: error
