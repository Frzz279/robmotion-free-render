<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RobMotion 3D Scene Engine V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9dbbd0}
canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:white;font:600 18px Arial;background:#172536;z-index:2}
</style>
</head>
<body>
<div id="loading">Loading RobMotion V2…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";
if (!window.THREE) {
  document.getElementById("loading").textContent = "Three.js failed to load. Check internet access.";
  throw new Error("Three.js CDN failed to load");
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c8dc);
scene.fog = new THREE.Fog(0xa9c8dc, 24, 78);

const camera = new THREE.PerspectiveCamera(38, 1080/1920, 0.1, 160);
camera.position.set(8, 7, 13);

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(1080,1920);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff, 0x53604a, 2.0));
const sun = new THREE.DirectionalLight(0xffe1b8, 3.2);
sun.position.set(-9,16,8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-24; sun.shadow.camera.right=24;
sun.shadow.camera.top=24; sun.shadow.camera.bottom=-24;
sun.shadow.bias=-0.0003;
scene.add(sun);

const mat = (color, roughness=0.86, metalness=0) =>
  new THREE.MeshStandardMaterial({color,roughness,metalness});
const materials = {
  grass:mat(0x66865a), road:mat(0x343b43), sidewalk:mat(0xbab9ad),
  white:mat(0xf1eee2), dark:mat(0x242b32), glass:mat(0x78a9bd,0.28),
  wood:mat(0x765039), leaf1:mat(0x426d42), leaf2:mat(0x5d874b),
  roof:mat(0x55464a), yellow:mat(0xe7b34d), blue:mat(0x367db7),
  skin:mat(0xd9a879), pants:mat(0x273e65), red:mat(0xb84e43)
};
function box(parent,w,h,d,material,x,y,z,cast=true,receive=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=receive;
  parent.add(m); return m;
}
function cylinder(parent,rt,rb,h,material,x,y,z,segments=10){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}

// Ground, road and sidewalks
box(scene,100,0.5,100,materials.grass,0,-0.32,0,false,true);
box(scene,7,0.12,62,materials.road,0,-0.02,0,false,true);
box(scene,1.25,0.22,62,materials.sidewalk,-4.1,0.02,0,false,true);
box(scene,1.25,0.22,62,materials.sidewalk,4.1,0.02,0,false,true);
for(let z=-27;z<30;z+=6) box(scene,0.16,0.025,2.8,materials.white,0,0.055,z,false,false);

// Houses with roofs, windows, doors and steps
function house(x,z,w,d,height,wallColor,roofColor){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const wall=mat(wallColor), roof=mat(roofColor);
  box(g,w,height,d,wall,0,height/2,0);
  const roofMesh=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.78,1.5,4),roof);
  roofMesh.rotation.y=Math.PI/4;roofMesh.position.y=height+0.65;
  roofMesh.scale.set(1,1,d/w);roofMesh.castShadow=true;g.add(roofMesh);
  const front=d/2+0.015;
  for(let wx of [-w*0.28,w*0.28]){
    box(g,w*0.22,height*0.28,0.07,materials.glass,wx,height*0.58,front);
    box(g,w*0.25,0.07,0.1,materials.white,wx,height*0.58,front+0.045,false);
    box(g,0.06,height*0.31,0.1,materials.white,wx,height*0.58,front+0.045,false);
  }
  box(g,w*0.2,height*0.48,0.09,materials.wood,0,height*0.24,front+0.03);
  box(g,w*0.25,0.12,0.65,materials.sidewalk,0,0.06,front+0.35);
}
house(-8,-7,5,5,4.2,0xd6c6a7,0x754b3d);
house(8,-11,5.5,5,5.1,0xd5d8d0,0x3d515e);
house(-9,8,5.5,5,4.6,0xc8b5a0,0x57434a);
house(9,7,5,5.5,4.1,0xe0d0b4,0x80513c);

// Street trees: textured-looking layered foliage, not plain cubes
function tree(x,z,s=1){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
  cylinder(g,0.22,0.34,2.4,materials.wood,0,1.2,0,8);
  const layers=[
    [1.95,1.55,materials.leaf1],
    [2.75,1.3,materials.leaf2],
    [3.45,0.95,materials.leaf1]
  ];
  layers.forEach(([y,r,m])=>{
    const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),m);
    crown.position.set(0,y,0);crown.castShadow=true;crown.receiveShadow=true;g.add(crown);
  });
  return g;
}
[[-5,-16],[-5,-4],[-5,9],[-5,21],[5,-20],[5,-6],[5,10],[5,23],[-13,-1],[13,1]].forEach((p,i)=>tree(p[0],p[1],i%3===0?1.15:0.9));

// Street lamps
function lamp(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  cylinder(g,0.09,0.13,3.8,materials.dark,0,1.9,0,8);
  box(g,0.95,0.09,0.12,materials.dark,0.42,3.72,0);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,8),new THREE.MeshStandardMaterial({color:0xffe6a5,emissive:0xffc45c,emissiveIntensity:1.1}));
  bulb.position.set(0.82,3.58,0);g.add(bulb);
}
lamp(-3.5,-12);lamp(3.5,1);lamp(-3.5,17);

// Parked car
const car=new THREE.Group();car.position.set(2.55,0.12,-5);scene.add(car);
box(car,1.8,0.62,3.2,materials.red,0,0.62,0);
box(car,1.45,0.65,1.65,materials.glass,0,1.18,-0.12);
for(const x of [-0.93,0.93])for(const z of [-1.05,1.05]){
  const wheel=cylinder(car,0.36,0.36,0.18,materials.dark,x,0.38,z,12);
  wheel.rotation.z=Math.PI/2;
}
for(const x of [-0.55,0.55])box(car,0.22,0.18,0.06,materials.yellow,x,0.65,1.62);

// Character builder with animated pivot groups
function makeCharacter(shirt,pants,hair,skin){
  const root=new THREE.Group();scene.add(root);
  const torso=box(root,0.9,1.05,0.48,mat(shirt),0,1.55,0);
  const head=box(root,0.72,0.72,0.72,mat(skin),0,2.48,0);
  box(root,0.75,0.2,0.76,mat(hair),0,2.91,0);
  // Face on the front (+Z)
  box(root,0.09,0.09,0.035,materials.dark,-0.17,2.52,0.38,false,false);
  box(root,0.09,0.09,0.035,materials.dark,0.17,2.52,0.38,false,false);
  const armPivots=[];
  for(const side of [-1,1]){
    const pivot=new THREE.Group();pivot.position.set(side*0.57,1.98,0);root.add(pivot);
    box(pivot,0.32,0.92,0.34,mat(skin),0,-0.43,0);
    armPivots.push(pivot);
  }
  const legPivots=[];
  for(const side of [-1,1]){
    const pivot=new THREE.Group();pivot.position.set(side*0.24,1.05,0);root.add(pivot);
    box(pivot,0.36,0.95,0.4,mat(pants),0,-0.48,0);
    box(pivot,0.38,0.2,0.58,materials.dark,0,-0.96,0.08);
    legPivots.push(pivot);
  }
  return {root,armPivots,legPivots};
}
const hero=makeCharacter(0x2675bd,0x263b60,0x38271f,0xd7a477);
hero.root.position.set(-1.05,0,3.2);
const friend=makeCharacter(0xd5a23c,0x3c5263,0x4b3022,0xc88f65);
friend.root.position.set(1.05,0,5.1);
friend.root.scale.setScalar(0.92);

// A few small environmental details
for(let z=-20;z<25;z+=4){
  box(scene,0.12,0.12,0.12,materials.yellow,-4.7,0.18,z,false,false);
  box(scene,0.12,0.12,0.12,materials.yellow,4.7,0.18,z,false,false);
}
const cloudMat=new THREE.MeshStandardMaterial({color:0xf4f6f4,roughness:1});
function cloud(x,y,z,s){
  const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
  [[0,0,0],[0.8,0.1,0],[1.5,0,0.1],[-0.7,-0.05,0]].forEach(([a,b,c],i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(s*(i===1?0.72:0.58),12,8),cloudMat);
    m.position.set(a,b,c);g.add(m);
  });
  return g;
}
const clouds=[cloud(-12,11,-22,1.2),cloud(10,13,-28,1.5),cloud(1,10,-35,1.0)];

window.duration=12;
window.renderAt=function(time){
  const t=Math.max(0,Math.min(window.duration,time));
  const walk=Math.sin(t*5.2);
  [hero,friend].forEach((c,i)=>{
    const phase=t*5.2+i*0.8;
    c.legPivots[0].rotation.x=Math.sin(phase)*0.48;
    c.legPivots[1].rotation.x=-Math.sin(phase)*0.48;
    c.armPivots[0].rotation.x=-Math.sin(phase)*0.32;
    c.armPivots[1].rotation.x=Math.sin(phase)*0.32;
    c.root.position.z=(i===0?3.2:5.1)-t*0.10;
    c.root.position.y=Math.abs(Math.sin(phase*2))*0.035;
  });
  camera.position.set(7.3+Math.sin(t*0.22)*1.3,6.6+Math.sin(t*0.3)*0.35,14.5-t*0.52);
  camera.lookAt(0,1.5,1.2-t*0.18);
  clouds.forEach((c,i)=>c.position.x=[-12,10,1][i]+t*(0.08+i*0.015));
  renderer.render(scene,camera);
  if(t===0) document.getElementById("loading").style.display="none";
};
window.renderAt(0);
})();
</script>
</body>
</html>
