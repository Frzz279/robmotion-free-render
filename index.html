<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#sub{position:fixed;left:5%;right:5%;top:60%;text-align:center;
 font:900 130px/1.05 Impact,"Arial Black",Arial,sans-serif;color:#fff;text-transform:uppercase;
 -webkit-text-stroke:16px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
</style></head><body><div id="sub"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="story.js"></script>
<script>
/* ===== GAYA VISUAL (ubah di sini, berlaku untuk semua naskah) ===== */
const MOODS={
 day:   {sky:0x8fd0ff,ground:0x5cae4a,hemi:.95,sun:.9, fog:[40,120]},
 sunset:{sky:0xffa36b,ground:0x6f9a48,hemi:.8, sun:.7, fog:[30,100]},
 night: {sky:0x101830,ground:0x2f5a3a,hemi:.45,sun:.25,fog:[20,70]},
 indoor:{sky:0x2a2a33,ground:0xc9a67a,hemi:.9, sun:.5, fog:[30,90]}
};
const FONT_COLOR={}; // subtitle diatur lewat CSS #sub di atas

/* ===== MESIN ===== */
const W=innerWidth,H=innerHeight;
const R=new THREE.WebGLRenderer({antialias:true});
R.setSize(W,H);R.setPixelRatio(1);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,W/H,.1,300);
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8a5a,1);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(20,30,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:120});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0005;S.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

const hex=n=>'#'+n.toString(16).padStart(6,'0');
const mats={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:0}));
function box(w,h,d,c,x,y,z,p){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c instanceof THREE.Material||Array.isArray(c)?c:mat(c));
 m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p&&p.add(m);return m;}
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}

function faceTex(skin,kind){
 return canvasTex(128,128,(x)=>{
  x.fillStyle=hex(skin);x.fillRect(0,0,128,128);x.strokeStyle='#000';x.fillStyle='#000';x.lineWidth=5;x.lineCap='round';
  const dots=()=>{[42,86].forEach(ex=>{x.beginPath();x.arc(ex,58,6,0,7);x.fill();});};
  if(kind==='smug'){[40,88].forEach(ex=>{x.fillStyle='#fff';x.beginPath();x.ellipse(ex,64,17,11,0,0,7);x.fill();x.stroke();
    x.fillStyle='#000';x.beginPath();x.arc(ex+4,68,5,0,7);x.fill();x.beginPath();x.moveTo(ex-19,57);x.lineTo(ex+19,57);x.stroke();});
    x.beginPath();x.arc(64,84,18,.2,Math.PI-.2);x.stroke();}
  else if(kind==='angry'){dots();x.beginPath();x.moveTo(30,42);x.lineTo(54,50);x.moveTo(98,42);x.lineTo(74,50);x.moveTo(46,92);x.lineTo(82,92);x.stroke();}
  else if(kind==='shock'){[42,86].forEach(ex=>{x.fillStyle='#fff';x.beginPath();x.arc(ex,56,13,0,7);x.fill();x.stroke();x.fillStyle='#000';x.beginPath();x.arc(ex,56,5,0,7);x.fill();});
    x.beginPath();x.ellipse(64,94,9,13,0,0,7);x.stroke();}
  else if(kind==='sad'){dots();x.beginPath();x.arc(64,104,18,Math.PI+.3,-.3);x.stroke();}
  else{dots();x.beginPath();x.arc(64,76,20,.25,Math.PI-.25);x.stroke();}
 });}

function makeChar(o){
 const g=new THREE.Group(),skin=o.skin??0xf2c18d,shirt=o.shirt??0x3a7bd5,pants=o.pants??0x2c3e50;
 box(2,2,1,shirt,0,3,0,g);
 const side=mat(skin),face=new THREE.MeshStandardMaterial({map:faceTex(skin,o.face),roughness:.55});
 box(1.2,1.2,1.2,[side,side,side,side,face,side],0,4.6,0,g);
 const pivot=(x,y,c,w,h)=>{const p=new THREE.Group();p.position.set(x,y,0);box(w,h,1,c,0,-h/2,0,p);g.add(p);return p;};
 g.armL=pivot(-1.5,4,o.sleeve??shirt,1,2);g.armR=pivot(1.5,4,o.sleeve??shirt,1,2);
 g.legL=pivot(-.5,2,pants,1,2);g.legR=pivot(.5,2,pants,1,2);
 const h=o.hat,hc=o.hatColor;
 if(h==='top'){box(1.9,.15,1.9,hc??0x111111,0,5.25,0,g);box(1.25,1.1,1.25,hc??0x111111,0,5.85,0,g);}
 else if(h==='cap'||h==='cop'){const c=hc??(h==='cop'?0x14284b:0xc0392b);box(1.35,.4,1.35,c,0,5.35,0,g);box(1.35,.12,.7,c,0,5.2,.9,g);}
 else if(h==='hair'){const c=hc??0x4a2f1b;box(1.35,.45,1.35,c,0,5.3,0,g);box(1.35,1,.3,c,0,4.8,-.55,g);}
 g.userData={o};return g;}

function makeProp(o){
 const g=new THREE.Group(),c=o.color;
 if(o.t==='tree'){box(.8,2.5,.8,0x6b4426,0,1.25,0,g);
  [[3,3.2],[2.3,5.2],[1.5,7]].forEach(([r,y])=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,3,6),mat(c??0x2e8b3d));m.position.y=y;m.castShadow=true;g.add(m);});}
 else if(o.t==='house'){const w=o.w??10,d=o.d??8,hh=o.h??6;box(w,hh,d,c??0xe8d9b5,0,hh/2,0,g);
  const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,3.5,4),mat(o.roof??0xb03a2e));r.position.y=hh+1.75;r.rotation.y=Math.PI/4;r.castShadow=true;g.add(r);
  box(2,3.5,.2,o.door??0xa93226,0,1.75,d/2+.05,g);box(2.2,2,.2,0x9fd3f0,-w/3,3.6,d/2+.05,g);}
 else if(o.t==='sign'){const bw=o.w??4,bh=o.h??3;box(.3,bh*.8+1,.3,0x555555,0,(bh*.8+1)/2,0,g);
  const tex=canvasTex(512,384,(x,w,h)=>{x.fillStyle=o.bg??'#fff';x.fillRect(0,0,w,h);x.fillStyle=o.fg??'#c00';x.font='900 110px Impact,Arial Black,sans-serif';
   x.textAlign='center';const L=String(o.text??'').split('\n');L.forEach((l,i)=>x.fillText(l,w/2,h/2+(i-(L.length-1)/2)*120+38));});
  const b=box(bw,bh,.3,0xffffff,0,bh/2+1.2,.2,g);const p=new THREE.Mesh(new THREE.PlaneGeometry(bw*.94,bh*.94),new THREE.MeshBasicMaterial({map:tex}));p.position.set(0,bh/2+1.2,.36);g.add(p);}
 else{box(o.w??2,o.h??2,o.d??2,c??0x999999,0,(o.h??2)/2,0,g);} // 'box' generik: dinding, kasur, mobil, dll.
 g.position.set(...(o.p??[0,0,0]));g.rotation.y=o.ry??0;return g;}

/* ===== BANGUN ADEGAN ===== */
const ST=window.STORY,scenes=[];let acc=0;
ST.scenes.forEach(s=>{
 const g=new THREE.Group();g.visible=false;S.add(g);
 (s.props||[]).forEach(p=>g.add(makeProp(p)));
 const chars=(s.chars||[]).map(o=>{const c=makeChar(o);g.add(c);return c;});
 scenes.push({s,g,chars,start:acc});acc+=s.dur;});
window.duration=acc;

const lerp=(a,b,u)=>a+(b-a)*u,sm=u=>u*u*(3-2*u);
const V=(a,b,u)=>a.map((v,i)=>lerp(v,b?b[i]:v,u));
const sub=document.getElementById('sub');

window.renderAt=async t=>{
 t=Math.min(t,acc-1e-3);
 const sc=scenes.find(x=>t>=x.start&&t<x.start+x.s.dur)||scenes[scenes.length-1];
 scenes.forEach(x=>x.g.visible=x===sc);
 const s=sc.s,lt=t-sc.start,u=lt/s.dur,e=sm(u),m=MOODS[s.mood||'day'];
 S.background=new THREE.Color(m.sky);S.fog=new THREE.Fog(m.sky,m.fog[0],m.fog[1]);
 hemi.intensity=m.hemi;sun.intensity=m.sun;ground.material.color.set(s.ground??m.ground);
 sc.chars.forEach(c=>{const o=c.userData.o,p=V(o.p??[0,0,0],o.to,e);
  c.position.set(p[0],p[1]||0,p[2]);c.rotation.y=o.ry??0;
  [c.armL,c.armR,c.legL,c.legR].forEach(l=>l.rotation.set(0,0,0));c.children.forEach(k=>{});
  const a=o.anim||'idle',sw=Math.sin(t*9)*.7;
  if(a==='walk'){c.armL.rotation.x=sw;c.armR.rotation.x=-sw;c.legL.rotation.x=-sw;c.legR.rotation.x=sw;}
  else if(a==='wave'){c.armR.rotation.z=2.7+Math.sin(t*10)*.3;}
  else if(a==='point'){c.armR.rotation.x=-1.57;}
  else if(a==='panic'){c.armL.rotation.z=-2.6+Math.sin(t*20)*.3;c.armR.rotation.z=2.6-Math.sin(t*20)*.3;}
  else{c.position.y+=Math.sin(t*3)*.05;}});
 const k=s.cam||{from:[0,5,14],look:[0,4,0]},cp=V(k.from,k.to,e),lk=V(k.look,k.look2,e),sh=(k.shake||0)*Math.sin(t*45);
 C.fov=k.fov??50;C.updateProjectionMatrix();
 C.position.set(cp[0]+sh,cp[1]+sh*.7,cp[2]);C.lookAt(lk[0],lk[1],lk[2]);
 const w=(s.say||'').trim().split(/\s+/).filter(Boolean);
 sub.textContent=w.length?w[Math.min(w.length-1,Math.floor(u*w.length))]:'';
 R.render(S,C);
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
</script></body></html>
