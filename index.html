<script>
/* ===== GAYA VISUAL (ubah di sini, berlaku untuk semua naskah) ===== */
const MOODS={
 day:   {sky:0x8fd0ff,ground:0x5cae4a,hemi:.95,sun:1.0,fog:[45,130],sc:0xfff1d6},
 sunset:{sky:0xffa36b,ground:0x6f9a48,hemi:.8, sun:.85,fog:[35,110],sc:0xffa968},
 night: {sky:0x101830,ground:0x2f5a3a,hemi:.5, sun:.35,fog:[22,80], sc:0x9bb4ff},
 indoor:{sky:0x2a2a33,ground:0xc9a67a,hemi:1.0,sun:.5, fog:[40,120],sc:0xfff6e6}
};
const FONT_COLOR={}; // subtitle diatur lewat CSS #sub di atas

/* ===== MESIN ===== */
const W=innerWidth,H=innerHeight;
const R=new THREE.WebGLRenderer({antialias:true});
R.setSize(W,H);R.setPixelRatio(1);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,W/H,.1,300);
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8a5a,1);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(20,30,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:120});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0005;S.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

const hex=n=>'#'+n.toString(16).padStart(6,'0');
const rnd=(()=>{let q=7;return()=>(q=(q*16807)%2147483647)/2147483647;})();
function canvasTex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);}return t;}
const L1=(x,a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();};
const PAT={
 grass:(x,w,h)=>{for(let i=0;i<1100;i++){x.fillStyle=rnd()<.5?'rgba(0,50,0,.2)':'rgba(220,255,140,.2)';x.fillRect(rnd()*w,rnd()*h,2,5+rnd()*7);}},
 tile:(x,w,h)=>{x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=3;x.strokeRect(0,0,w,h);for(let i=1;i<4;i++){L1(x,i*w/4,0,i*w/4,h);L1(x,0,i*h/4,w,i*h/4);}},
 brick:(x,w,h)=>{x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;for(let r=0;r<8;r++){const y=r*h/8;L1(x,0,y,w,y);for(let k=0;k<4;k++){const bx=(k+(r%2?.5:0))*w/4;L1(x,bx,y,bx,y+h/8);}}},
 siding:(x,w,h)=>{for(let r=0;r<10;r++){x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,r*h/10,w,4);x.fillStyle='rgba(255,255,255,.14)';x.fillRect(0,r*h/10+4,w,3);}},
 shingle:(x,w,h)=>{x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=3;for(let r=0;r<8;r++){const y=r*h/8;L1(x,0,y,w,y);for(let k=0;k<6;k++){const bx=(k+(r%2?.5:0))*w/6;L1(x,bx,y,bx,y+h/8);}}},
 plank:(x,w,h)=>{x.strokeStyle='rgba(0,0,0,.32)';x.lineWidth=3;for(let i=0;i<6;i++){L1(x,0,i*h/6,w,i*h/6);for(let k=0;k<14;k++){x.fillStyle='rgba(60,30,0,.1)';x.fillRect(rnd()*w,i*h/6+5,rnd()*70,2);}}},
 road:(x,w,h)=>{x.fillStyle='#e8c33a';for(let i=0;i<2;i++)x.fillRect(w*.47,i*h/2+h*.08,w*.06,h*.3);}
};
const texC={};
function pat(kind,c,rep){const key=kind+c;
 const t=texC[key]||(texC[key]=canvasTex(256,256,(x,w,h)=>{x.fillStyle=hex(c);x.fillRect(0,0,w,h);
  for(let i=0;i<4000;i++){x.fillStyle=rnd()<.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.07)';x.fillRect(rnd()*w,rnd()*h,2,2);}
  if(PAT[kind])PAT[kind](x,w,h);}));
 if(!rep)return t;const k2=key+rep;
 return texC[k2]||(texC[k2]=(()=>{const q=t.clone();q.wrapS=q.wrapT=THREE.RepeatWrapping;q.repeat.set(...rep);q.needsUpdate=true;return q;})());}
const matC={};
const mat=(c,k='grain')=>matC[k+c]||(matC[k+c]=new THREE.MeshStandardMaterial({map:pat(k,c),roughness:.6,metalness:0}));
let MD='day';
function rgeo(w,h,d,r){const g=new THREE.BoxGeometry(w,h,d,4,4,4),p=g.attributes.position,n=g.attributes.normal,iw=w/2-r,ih=h/2-r,id=d/2-r,cl=(v,m)=>Math.max(-m,Math.min(m,v));
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),cx=cl(x,iw),cy=cl(y,ih),cz=cl(z,id),dx=x-cx,dy=y-cy,dz=z-cz,l=Math.hypot(dx,dy,dz);
  if(l>1e-6){p.setXYZ(i,cx+dx/l*r,cy+dy/l*r,cz+dz/l*r);n.setXYZ(i,dx/l,dy/l,dz/l);}}
 return g;}
function box(w,h,d,c,x,y,z,p,k,rep,rd){
 let m=c;if(!(c instanceof THREE.Material||Array.isArray(c)))m=k?new THREE.MeshStandardMaterial({map:pat(k,c,rep||[Math.max(1,Math.round(Math.max(w,d)/3)),Math.max(1,Math.round(h/3))]),roughness:.55}):mat(c);
 const o=new THREE.Mesh(rd?rgeo(w,h,d,rd):new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o;}
const rb=(w,h,d,c,x,y,z,p,r)=>box(w,h,d,c,x,y,z,p,undefined,undefined,r);
const rim=new THREE.DirectionalLight(0xbcd8ff,.35);rim.position.set(-15,10,-20);S.add(rim);
const skyM=new THREE.Mesh(new THREE.SphereGeometry(220,24,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,fog:false}));S.add(skyM);
const SKY={day:['#4aa8ff','#d8f0ff'],sunset:['#ff7a50','#ffdca8'],night:['#040916','#1a2a55'],indoor:['#2a2a33','#3a3a46']};
const skyT={};
function skyTex(m){return skyT[m]||(skyT[m]=canvasTex(1024,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);
 g.addColorStop(0,SKY[m][0]);g.addColorStop(.55,SKY[m][1]);g.addColorStop(1,SKY[m][1]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(m==='indoor')return;
 if(m==='night'){for(let i=0;i<250;i++){x.fillStyle='rgba(255,255,255,'+(.3+rnd()*.7)+')';x.fillRect(rnd()*w,rnd()*h*.5,2,2);}return;}
 for(let i=0;i<14;i++){const cx=rnd()*w,cy=h*(.25+rnd()*.22);for(let k=0;k<7;k++){x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.ellipse(cx+k*28-80,cy+Math.sin(k)*8,50+rnd()*30,20+rnd()*10,0,0,7);x.fill();}}}));}

const FACES={
 smile:{e:11,p:5,l:0,b:-.1,m:'smile'},happy:{e:12,p:5,l:0,b:-.3,m:'open'},shock:{e:15,p:3,l:0,b:-.4,y:-10,m:'O'},
 angry:{e:11,p:5,l:.45,b:.55,m:'frown'},sad:{e:12,p:6,l:0,b:-.5,m:'frown',t:1},smug:{e:12,p:5,l:.5,b:.05,m:'smirk'},
 cry:{e:12,p:6,l:0,b:-.55,m:'O',t:2},sleepy:{e:11,p:0,l:1,b:0,m:'flat'}};
function faceTex(skin,kind){const F=FACES[kind]||FACES.smile;return canvasTex(256,256,(x)=>{
 x.fillStyle=hex(skin);x.fillRect(0,0,256,256);x.lineCap='round';x.lineJoin='round';
 x.fillStyle='rgba(255,90,90,.2)';[84,172].forEach(a=>{x.beginPath();x.ellipse(a,178,24,12,0,0,7);x.fill();});
 [84,172].forEach((ex,i)=>{const ey=132,rx=F.e*2.1,ry=F.e*2.6;
  x.fillStyle='#fff';x.strokeStyle='#111';x.lineWidth=7;x.beginPath();x.ellipse(ex,ey,rx,ry,0,0,7);x.fill();x.stroke();
  x.fillStyle='#111';x.beginPath();x.ellipse(ex+(i?-3:3),ey+6,F.p*2.2+4,F.p*2.8+5,0,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(ex-4,ey-3,5,0,7);x.fill();
  if(F.l){const ly=ey-ry+2*ry*F.l;x.fillStyle=hex(skin);x.fillRect(ex-rx-6,ey-ry-8,2*rx+12,ly-(ey-ry-8));x.strokeStyle='#111';x.lineWidth=7;x.beginPath();x.moveTo(ex-rx,ly);x.lineTo(ex+rx,ly);x.stroke();}
  x.strokeStyle='#111';x.lineWidth=11;const by=ey-ry-16+(F.y||0),o=ex+(i?30:-30),n=ex-(i?30:-30);
  x.beginPath();x.moveTo(o,by-F.b*22);x.lineTo(n,by+F.b*22);x.stroke();
  if(F.t){x.fillStyle='#6cc8ff';x.beginPath();x.ellipse(ex,ey+ry+14,8,16,0,0,7);x.fill();if(F.t>1)x.fillRect(ex-6,ey+ry+14,12,50);}});
 x.strokeStyle='#111';x.lineWidth=8;x.fillStyle='#4a1010';
 if(F.m==='smile'){x.beginPath();x.arc(128,190,28,.15,Math.PI-.15);x.stroke();}
 else if(F.m==='open'){x.beginPath();x.arc(128,186,36,0,Math.PI);x.closePath();x.fill();x.stroke();}
 else if(F.m==='O'){x.beginPath();x.ellipse(128,212,16,22,0,0,7);x.fill();x.stroke();}
 else if(F.m==='frown'){x.beginPath();x.arc(128,234,28,Math.PI+.25,-.25);x.stroke();}
 else if(F.m==='smirk'){x.beginPath();x.moveTo(98,210);x.quadraticCurveTo(140,226,170,196);x.stroke();}
 else{x.beginPath();x.moveTo(104,212);x.lineTo(152,212);x.stroke();}
 });}

function torsoTex(shirt,f,acc){return canvasTex(128,128,(x,w,h)=>{x.fillStyle=hex(shirt);x.fillRect(0,0,w,h);
 for(let i=0;i<1500;i++){x.fillStyle=rnd()<.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.07)';x.fillRect(rnd()*w,rnd()*h,2,2);}
 x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.45)';x.fillStyle=hex(acc);
 if(f==='suit'){x.fillStyle='#fff';x.beginPath();x.moveTo(44,0);x.lineTo(64,44);x.lineTo(84,0);x.fill();x.fillStyle=hex(acc);x.fillRect(60,30,8,70);
  x.beginPath();x.moveTo(64,24);x.lineTo(73,36);x.lineTo(64,46);x.lineTo(55,36);x.fill();L1(x,44,0,30,70);L1(x,84,0,98,70);}
 else if(f==='jacket'){L1(x,64,0,64,h);x.strokeRect(14,70,32,34);x.strokeRect(82,70,32,34);x.fillStyle='rgba(255,255,255,.2)';x.fillRect(0,h-14,w,14);}
 else if(f==='uniform'){L1(x,64,0,64,h);x.fillStyle='#e6c340';x.beginPath();x.arc(92,34,9,0,7);x.fill();[30,56,82].forEach(y=>{x.beginPath();x.arc(58,y+8,3,0,7);x.fill();});x.fillStyle='#1b1b1b';x.fillRect(0,h-16,w,16);}
 else if(f==='hoodie'){x.strokeRect(30,76,68,40);L1(x,52,0,52,36);L1(x,76,0,76,36);}
 else{x.beginPath();x.arc(64,0,22,0,Math.PI);x.stroke();}});}

function makeChar(o){
 const g=new THREE.Group(),skin=o.skin??0xf2c18d,shirt=o.shirt??0x3a7bd5,pants=o.pants??0x2c3e50,sl=o.sleeve??shirt;
 const ft=new THREE.MeshStandardMaterial({map:torsoTex(shirt,o.outfit,o.accent??0xc0392b),roughness:.5}),sm_=mat(shirt);
 g.torso=rb(2,2,1,[sm_,sm_,sm_,sm_,ft,sm_],0,3,0,g,.2);
 const hd=new THREE.Group();hd.position.set(0,4,0);g.add(hd);g.head=hd;
 const side=mat(skin),face=new THREE.MeshStandardMaterial({map:faceTex(skin,o.face),roughness:.45});
 rb(1.3,1.3,1.3,[side,side,side,side,face,side],0,.65,0,hd,.3);
 const limb=(x,y,c1,c2,r)=>{const p=new THREE.Group(),Ln=2;p.position.set(x,y,0);rb(1,Ln*r,1,c1,0,-Ln*r/2,0,p,.16);rb(.96,Ln*(1-r),.96,c2,0,-Ln*r-Ln*(1-r)/2,0,p,.2);g.add(p);return p;};
 const hand=o.longSleeve?sl:skin;
 g.armL=limb(-1.5,4,sl,hand,.7);g.armR=limb(1.5,4,sl,hand,.7);g.legL=limb(-.5,2,pants,0x1b1b1b,.8);g.legR=limb(.5,2,pants,0x1b1b1b,.8);
 const h=o.hat,hc=o.hatColor;
 if(h==='top'){box(2,.15,2,hc??0x111111,0,1.3,0,hd);rb(1.35,1.2,1.35,hc??0x111111,0,1.95,0,hd,.12);}
 else if(h==='cap'||h==='cop'){const c=hc??(h==='cop'?0x14284b:0xc0392b);rb(1.45,.55,1.45,c,0,1.2,0,hd,.22);rb(1.4,.1,.8,c,0,1.0,.95,hd,.04);if(h==='cop')rb(.4,.4,.1,0xe6c340,0,1.25,.75,hd,.05);}
 else if(h==='hair'){const c=hc??0x4a2f1b,hs=o.hairStyle||'short';
  rb(1.5,.55,1.5,c,0,1.2,0,hd,.22);rb(1.5,1.1,.35,c,0,.65,-.62,hd,.15);rb(.3,.75,1.2,c,-.72,.85,-.05,hd,.12);rb(.3,.75,1.2,c,.72,.85,-.05,hd,.12);rb(1.45,.3,.3,c,0,1.1,.68,hd,.12);
  if(hs==='long')rb(1.5,1.9,.35,c,0,.1,-.62,hd,.15);
  if(hs==='spiky')for(let i=-2;i<=2;i++){const k=rb(.35,.7,.35,c,i*.3,1.7,0,hd,.08);k.rotation.z=-i*.25;}}
 g.userData={o};
 if(o.tag){const sp=new THREE.Sprite(new THREE.SpriteMaterial({fog:false,map:canvasTex(256,128,(x,w,h)=>{x.fillStyle='rgba(0,0,0,.85)';x.fillRect(8,24,w-16,80);x.strokeStyle=o.tagColor||'#ff3b30';x.lineWidth=5;x.strokeRect(8,24,w-16,80);
  x.fillStyle=o.tagColor||'#ff3b30';x.font='900 64px Impact,Arial Black,sans-serif';x.textAlign='center';x.fillText(o.tag,w/2,86);})}));sp.scale.set(3.4,1.7,1);sp.position.y=7.4;g.add(sp);}
 if(o.s)g.scale.setScalar(o.s);
 return g;}

function makeProp(o){
 const g=new THREE.Group(),c=o.color,T=o.t;
 if(T==='tree'){box(.9,3,.9,0x6b4426,0,1.5,0,g,'plank');
  const Lm=new THREE.MeshStandardMaterial({map:pat('grass',c??0x3a9d3a),roughness:.8,flatShading:true});
  [[0,4.6,0,2.8],[1.2,6,.5,2],[-1.1,5.6,-.4,1.9]].forEach(([x,y,z,r])=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),Lm);m.position.set(x,y,z);m.castShadow=true;g.add(m);});}
 else if(T==='house'){const w=o.w??10,d=o.d??8,h=o.h??6;box(w,h,d,c??0xe8d9b5,0,h/2,0,g,o.wall??'siding');
  const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,3.5,4),new THREE.MeshStandardMaterial({map:pat('shingle',o.roof??0xb03a2e,[4,2]),roughness:.7,flatShading:true}));
  r.position.y=h+1.75;r.rotation.y=Math.PI/4;r.castShadow=true;g.add(r);
  box(2,3.5,.2,o.door??0xa93226,0,1.75,d/2+.05,g);box(.25,.25,.2,0xffd34d,.7,1.7,d/2+.2,g);
  [-w/3,w/3].forEach(x=>{box(2.6,2.2,.15,0xffffff,x,3.8,d/2+.05,g);{const gl=box(2.3,1.9,.2,0x9fd3f0,x,3.8,d/2+.08,g);if(MD==='night'||MD==='sunset')gl.material=new THREE.MeshBasicMaterial({color:MD==='night'?0xffe08a:0xffcf8a});}box(.15,1.9,.25,0xffffff,x,3.8,d/2+.12,g);box(2.3,.15,.25,0xffffff,x,3.8,d/2+.12,g);});
  box(3.5,.4,1.8,0xbbbbbb,0,.2,d/2+.9,g,'tile');}
 else if(T==='sign'){const bw=o.w??4,bh=o.h??3;box(.3,bh*.8+1,.3,0x555555,0,(bh*.8+1)/2,0,g);
  const tex=canvasTex(512,384,(x,w,h)=>{x.fillStyle=o.bg??'#fff';x.fillRect(0,0,w,h);x.fillStyle=o.fg??'#c00';x.font='900 110px Impact,Arial Black,sans-serif';
   x.textAlign='center';const Ls=String(o.text??'').split('\n');Ls.forEach((l,i)=>x.fillText(l,w/2,h/2+(i-(Ls.length-1)/2)*120+38));});
  box(bw,bh,.3,0xffffff,0,bh/2+1.2,.2,g);const p=new THREE.Mesh(new THREE.PlaneGeometry(bw*.94,bh*.94),new THREE.MeshBasicMaterial({map:tex}));p.position.set(0,bh/2+1.2,.36);g.add(p);}
 else if(T==='road'){const n=o.len??100;box(o.w??12,.1,n,0x3a3a40,0,.05,0,g,'road',[1,Math.round(n/6)]);}
 else if(T==='path'){box(o.w??4,.15,o.len??30,c??0xbfbfbf,0,.08,0,g,'tile');}
 else if(T==='bush'){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(o.r??1.3,0),new THREE.MeshStandardMaterial({map:pat('grass',c??0x2f8f3f),flatShading:true,roughness:.8}));m.position.y=.9;m.castShadow=true;g.add(m);}
 else if(T==='fence'){const n=o.n??8;for(let i=0;i<n;i++)box(.4,2.2,.3,c??0xffffff,i*1.2,1.1,0,g,'plank');box(n*1.2,.3,.25,c??0xffffff,(n-1)*.6,1.5,.1,g);}
 else if(T==='lamp'){box(.3,7,.3,0x333333,0,3.5,0,g);const b=new THREE.Mesh(new THREE.SphereGeometry(.6,10,8),new THREE.MeshBasicMaterial({color:0xfff2b0}));b.position.y=7.3;g.add(b);}
 else if(T==='flower'){for(let i=0;i<6;i++){const x=rnd()*1.6-.8,z=rnd()*1.6-.8,m=new THREE.Mesh(new THREE.SphereGeometry(.28,6,5),mat(c??0xff5c8a));m.position.set(x,.55+rnd()*.3,z);g.add(m);box(.08,.5,.08,0x2e8b3d,x,.25,z,g);}}
 else if(T==='rock'){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(o.r??.9,0),new THREE.MeshStandardMaterial({color:0x8d8d92,flatShading:true,roughness:.9}));m.scale.y=.6;m.position.y=.4;m.castShadow=true;g.add(m);}
 else if(T==='bench'){rb(4,.3,1.2,0x9a6b3f,0,1.3,0,g,.1);rb(4,1,.2,0x9a6b3f,0,2,-.5,g,.08);[-1.6,1.6].forEach(x=>box(.3,1.3,1,0x333333,x,.65,0,g));}
 else if(T==='plant'){rb(1.2,1.2,1.2,0xb5651d,0,.6,0,g,.2);const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,0),new THREE.MeshStandardMaterial({color:0x3a9d3a,flatShading:true}));m.position.y=2.2;m.castShadow=true;g.add(m);}
 else if(T==='rug'){box(o.w??12,.06,o.d??8,c??0x9b2d30,0,.04,0,g,'tile');}
 else if(T==='shelf'){rb(5,7,1.2,0x7a5230,0,3.5,0,g,.1);for(let r=0;r<4;r++)for(let i=0;i<5;i++)box(.5,.9+rnd()*.5,.7,[0xc0392b,0x2d7dd2,0x27ae60,0xe6c340,0x8e44ad][(i+r)%5],-2+i*.9,1.2+r*1.7,.1,g);}
